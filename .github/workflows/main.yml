name: Compilar Minhas Financas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Conferir projeto Android
        run: |
          echo "================================"
          echo " ARQUIVOS DO PROJETO"
          echo "================================"
          ls -la

          echo ""
          echo "Verificando estrutura..."

          test -d app || {
            echo "ERRO: pasta app nao encontrada"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "ERRO: app/build.gradle.kts nao encontrado"
            exit 1
          }

          test -f build.gradle.kts || {
            echo "ERRO: build.gradle.kts nao encontrado"
            exit 1
          }

          test -f settings.gradle.kts || {
            echo "ERRO: settings.gradle.kts nao encontrado"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERRO: AndroidManifest.xml nao encontrado"
            exit 1
          }

          echo ""
          echo "PROJETO ANDROID OK"

      - name: Verificar Gradle
        run: |
          gradle --version

      - name: Limpar projeto
        run: |
          gradle clean --stacktrace

      - name: Compilar APK
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Localizar APK
        run: |
          echo "================================"
          echo " APK GERADO"
          echo "================================"

          find app/build/outputs -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk || {
            echo "ERRO: APK nao foi encontrado"
            exit 1
          }

      - name: Renomear APK
        run: |
          mkdir -p apk-final

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            apk-final/Minhas-Financas.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Minhas-Financas-APK
          path: apk-final/Minhas-Financas.apk
          if-no-files-found: error
          retention-days: 30
